name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Build downloadable package
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tgz \
            --repo "$GITHUB_REPOSITORY" \
            --title "Auto AI Sensei $GITHUB_REF_NAME" \
            --generate-notes
